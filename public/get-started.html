<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get Started | Senior Living Kit</title>
    <meta name="description" content="Book a free Senior Living Kit consultation or join the newsletter using mock-first form integrations.">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/forms.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Senior Living Kit</a>
      <nav aria-label="Primary navigation">
        <a href="/services.html">Services</a>
        <a href="/process.html">Process</a>
        <a href="/about.html">About</a>
        <a class="nav-cta" href="/get-started.html" aria-current="page">Get Started</a>
      </nav>
    </header>
    <main class="page contact-layout">
      <section class="page-heading">
        <p class="eyebrow">Get started</p>
        <h1>Book a free consultation with Kit.</h1>
        <p>Share a few details and the mock lead handler will confirm the intended next step without sending data to production services.</p>
      </section>
      <form class="lead-form" data-mock-form>
        <label>
          Name
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Phone
          <input name="phone" type="tel" autocomplete="tel">
        </label>
        <label>
          What kind of help do you need?
          <select name="need" required>
            <option value="">Select one</option>
            <option>Senior housing guidance</option>
            <option>Healthcare navigation</option>
            <option>Downsizing support</option>
            <option>Family consultation</option>
          </select>
        </label>
        <label>
          Message
          <textarea name="message" rows="5"></textarea>
        </label>
        <button class="button primary" type="submit">Request consultation</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer class="site-footer">
      <p>&copy; Senior Living Kit 2026</p>
      <a href="/">Senior Living Kit home</a>
    </footer>
  </body>
</html>
